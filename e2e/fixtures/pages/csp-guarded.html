<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CSP-guarded fixture</title>
  </head>
  <body>
    <h1 id="csp-guarded-heading">This page guards itself with a CSP</h1>
    <p>Served with <code>Content-Security-Policy: script-src 'none'</code>, which allows framing but no scripts.</p>
    <p id="csp-probe">inline script blocked</p>
    <script>
      document.getElementById("csp-probe").textContent = "inline script ran";
    </script>
  </body>
</html>
