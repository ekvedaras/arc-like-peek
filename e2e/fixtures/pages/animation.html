<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Animation fixture</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; margin: 40px; }
      #box {
        width: 200px; height: 200px; background: #5b5bd6; border-radius: 16px;
        opacity: 0; transform: translateY(40px) scale(0.5);
        transition: opacity 400ms linear, transform 400ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      #box.shown { opacity: 1; transform: translateY(0) scale(1); }
    </style>
  </head>
  <body>
    <button id="show" type="button" onclick="document.getElementById('box').classList.add('shown')">Show</button>
    <div id="box"></div>
  </body>
</html>
