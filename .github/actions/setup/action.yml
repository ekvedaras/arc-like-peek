name: Set up
description: Bun, dependencies and Chromium for the Playwright e2e specs.

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.2

    - uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    - run: bun install --frozen-lockfile
      shell: bash

    # Playwright 1.63.0 uses Chromium revision 1243 (see wiki/environment/e2e-harness.md).
    - uses: actions/cache@v4
      id: playwright-browser
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-1243-${{ runner.os }}

    - name: Install Chromium
      if: steps.playwright-browser.outputs.cache-hit != 'true'
      run: bun --bun playwright install --with-deps chromium
      shell: bash

    - name: Install Chromium system libraries
      if: steps.playwright-browser.outputs.cache-hit == 'true'
      run: bun --bun playwright install-deps chromium
      shell: bash
