name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - run: bun run check

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: artifacts
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
